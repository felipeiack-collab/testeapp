<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Grão — Registrar a xícara</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&amp;family=Manrope:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#EFE7DA;text-decoration:none}a:hover{color:#FFFFFF}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0F0D0B; color: #EFE7DA; font-family: 'Manrope', system-ui, sans-serif; padding: 28px 24px; display: flex; flex-direction: column; gap: 22px">

<div style="display: flex; align-items: center; justify-content: space-between">
<a href="Main.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #2E2924; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#EFE7DA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<span style="display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 2px; color: #9C9284">LEVA 15 SEGUNDOS<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="#EFE7DA" stroke-width="1.4"></circle><circle cx="12" cy="12" r="2.6" fill="{{accent}}"></circle></svg></span>
</div>

<span style="font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 500; line-height: 1.05">Como foi<br>o café de hoje?</span>

<div style="display: flex; gap: 14px; align-items: center; padding: 14px; background: #1A1714; border: 1px solid #2E2924; border-radius: 18px">
<div style="width: 60px; height: 76px; border-radius: 10px; background: #2A1E16; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><ellipse cx="12" cy="12" rx="7" ry="9.5" transform="rotate(30 12 12)"></ellipse><path d="M9 5.5c3 3 3 10 6 13"></path></svg></div>
<div style="display: flex; flex-direction: column; gap: 3px; flex: 1">
<span style="font-size: 10px; letter-spacing: 2px; color: {{accent}}">RECONHECIDO PELA FOTO</span>
<span style="font-family: 'Cormorant Garamond', serif; font-size: 22px">Sítio Boa Vista</span>
<span style="font-size: 12px; color: #9C9284">Catuaí Amarelo · torra média · Cerrado Mineiro</span>
</div>
<button type="button" aria-label="Fotografar outro pacote" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #2E2924; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#EFE7DA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></button>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 11px; letter-spacing: 2px; color: #9C9284">MÉTODO</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{metodos}}" as="m" hint-placeholder-count="5">
<button type="button" onClick="{{m.pick}}" style="{{m.style}}">{{m.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 11px; letter-spacing: 2px; color: #9C9284">COMO FICOU NA BOCA</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{sintomas}}" as="s" hint-placeholder-count="6">
<button type="button" onClick="{{s.pick}}" style="{{s.style}}"><span style="font-family: 'Cormorant Garamond', serif; font-size: 19px">{{s.label}}</span><span style="font-size: 11px; color: #9C9284">{{s.hint}}</span></button>
</sc-for>
</div>
</div>

<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 11px; letter-spacing: 2px; color: #9C9284">NOTA EM PONTOS</span>
<div style="display: flex">
<sc-for list="{{estrelas}}" as="e" hint-placeholder-count="5">
<button type="button" onClick="{{e.pick}}" aria-label="{{e.aria}}" style="width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7" stroke="{{accent}}" stroke-width="1.5" fill="{{e.fill}}"></circle></svg></button>
</sc-for>
</div>
</div>

<a href="Ajuste.dc.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 999px; background: {{accent}}; color: #0F0D0B; font-size: 13px; font-weight: 700; letter-spacing: 2px">VER COMO MELHORAR</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B8926A","options":["#B8926A","#C9B48A","#A9B3A0"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { metodo: 'pano', sintoma: 'amargo', nota: 3 };
}
renderVals() {
const accent = this.props.accent ?? '#B8926A';
const chip = (on) => 'min-height: 44px; padding: 0 16px; border-radius: 999px; font-size: 13px; font-weight: 600; ' + (on ? 'background: #EFE7DA; color: #0F0D0B; border: 1px solid #EFE7DA' : 'background: transparent; color: #EFE7DA; border: 1px solid #3A332C');
const metodos = [
{ id: 'pano', label: 'Coador de pano' },
{ id: 'melitta', label: 'Filtro de papel' },
{ id: 'italiana', label: 'Italiana' },
{ id: 'prensa', label: 'Prensa francesa' },
{ id: 'eletrica', label: 'Cafeteira elétrica' }
].map((m) => ({ ...m, style: chip(this.state.metodo === m.id), pick: () => this.setState({ metodo: m.id }) }));
const card = (on) => 'min-height: 64px; padding: 10px 14px; border-radius: 14px; text-align: left; display: flex; flex-direction: column; gap: 2px; color: #EFE7DA; background: ' + (on ? '#1A1714; border: 1px solid ' + accent : '#1A1714; border: 1px solid #2E2924');
const sintomas = [
{ id: 'amargo', label: 'Amargo', hint: 'pesado, queimado' },
{ id: 'azedo', label: 'Azedo', hint: 'cortante, verde' },
{ id: 'aguado', label: 'Aguado', hint: 'fraco, sem graça' },
{ id: 'seco', label: 'Seca a boca', hint: 'adstringente' },
{ id: 'forte', label: 'Forte demais', hint: 'denso, pesado' },
{ id: 'bom', label: 'Ficou ótimo', hint: 'equilibrado' }
].map((s) => ({ ...s, style: card(this.state.sintoma === s.id), pick: () => this.setState({ sintoma: s.id }) }));
const estrelas = [1, 2, 3, 4, 5].map((n) => ({ aria: n + ' de 5', fill: n <= this.state.nota ? accent : 'none', pick: () => this.setState({ nota: n }) }));
return { accent, metodos, sintomas, estrelas };
}
}
</script>
</body>
</html>
