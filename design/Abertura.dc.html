<x-dc>
<helmet>

<style>
body{margin:0}
a{color:#EFE7DA;text-decoration:none}a:hover{color:#FFFFFF}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0F0D0B; color: #EFE7DA; font-family: 'Manrope', system-ui, sans-serif; padding: 0 28px 40px; display: flex; flex-direction: column">

<div style="display: flex; flex-direction: column; gap: 10px; align-items: center">
<span style="font-family: 'Cormorant Garamond', serif; font-size: 76px; font-weight: 500; line-height: 0.9; letter-spacing: -1.5px">ponto<span style="color: {{accent}}">.</span></span>
<span style="font-family: 'Cormorant Garamond', serif; font-size: 22px; font-style: italic; color: #B9AFA2">Encontre o seu ponto.</span>

<p style="margin: 0; max-width: 280px; font-size: 14px; line-height: 1.6; color: #9C9284">Registre o café de cada dia, entenda o que mudou e acerte a próxima xícara com o que você já tem em casa.</p>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B8926A","options":["#B8926A","#C9B48A","#A9B3A0"]},"$preview":{"width":390,"height":844}}'>
